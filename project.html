
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Project | Mekhi Powell</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
:root {
    color-scheme: dark;
    --text: #E8EDDF;
    --muted: #CFDBD5;
    --yellow: #F8C537;
    --background: #242423;
    --surface: #333533;
    --border: rgba(207, 219, 213, 0.18);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: 'DM Sans', Arial, sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
::selection { background: var(--yellow); color: var(--background); }
.container { width: min(1180px, calc(100% - 64px)); margin-inline: auto; }
h1, h2, h3 { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 500; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 5px; }
header { padding: 26px 0 0; }
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
}
.logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;
}
.logo::before {
    content: '';
    width: 15px;
    height: 15px;
    border: 4px solid var(--yellow);
    border-radius: 50%;
}
.nav-links { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
.nav-links a { padding: 8px 14px; border-radius: 999px; color: var(--muted); }
.nav-links a:hover { background: var(--surface); color: var(--text); }
.nav-links a:last-child { border: 1px solid var(--border); }
.project-header { padding: 44px 0 48px; }
.back-link {
    display: inline-block;
    margin-bottom: 42px;
    padding: 9px 18px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    font-size: 12px;
}
.back-link:hover { color: var(--text); border-color: var(--yellow); }
.project-label {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--yellow);
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 2px;
}
.project-label::before { content: ''; width: 28px; height: 2px; background: var(--yellow); }
.project-header h1 {
    max-width: 1000px;
    margin: 20px 0;
    font-size: clamp(38px, 6vw, 76px);
    line-height: 1.08;
    letter-spacing: -0.055em;
    overflow-wrap: break-word;
}
.project-subtitle { max-width: 800px; color: var(--muted); font-size: 15px; }
.project-hero {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
}
.project-hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
.project-hero img.contain { object-fit: contain; padding: 20px; background: #E8EDDF; }
.project-hero img.manatee { object-position: 35% center; }
.project-content {
    display: grid;
    grid-template-columns: 245px minmax(0, 1fr);
    align-items: start;
    gap: clamp(32px, 6vw, 85px);
    padding: 65px 0 40px;
}
.project-sidebar { color: var(--muted); font-size: 13px; }
.project-sidebar > div {
    padding: 22px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-top: 3px solid var(--yellow);
    border-radius: 12px;
    background: var(--surface);
}
.project-sidebar strong {
    display: block;
    margin-bottom: 12px;
    color: var(--text);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}
.project-sidebar p { margin: 0; }
.project-body { min-width: 0; max-width: 800px; }
.project-body section { padding-bottom: 30px; margin-bottom: 32px; border-bottom: 1px solid var(--border); }
.project-body h2 { margin: 0 0 18px; font-size: clamp(25px, 3vw, 34px); line-height: 1.2; letter-spacing: -0.04em; }
.project-body p, .project-body li { color: var(--muted); font-size: 15px; line-height: 1.9; }
.project-body p { margin: 0; }
.project-body ul { margin: 0; padding-left: 22px; }
.project-body li { padding-left: 6px; margin-bottom: 14px; }
.project-body li::marker { color: var(--yellow); }
.gallery-section { padding: 32px 0 65px; }
.gallery-section h2 {
    margin: 0 0 30px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
    font-size: clamp(30px, 4vw, 44px);
    line-height: 1.2;
    letter-spacing: -0.045em;
}
.project-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
.project-gallery figure { margin: 0; min-width: 0; }
.project-gallery a {
    display: block;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    transition: border-color 200ms ease, transform 200ms ease;
}
.project-gallery img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 300ms ease; }
.project-gallery img.contain { object-fit: contain; padding: 12px; background: #E8EDDF; }
.project-gallery a:hover { border-color: var(--yellow); transform: translateY(-3px); }
.project-gallery a:hover img { transform: scale(1.03); }
.project-gallery figcaption { margin-top: 12px; color: var(--muted); font-size: 13px; }
.next-project { padding: 15px 0 80px; }
.next-project a {
    display: inline-flex;
    padding: 13px 24px;
    border-radius: 999px;
    background: var(--yellow);
    color: var(--background);
    font-size: 13px;
    font-weight: 700;
}
.next-project a:hover { background: var(--text); }
footer { padding: 28px 0 36px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
@media (max-width: 768px) {
    .container { width: calc(100% - 36px); }
    header { padding-top: 20px; }
    nav { align-items: flex-start; flex-direction: column; gap: 16px; padding-bottom: 18px; }
    .nav-links { gap: 4px; }
    .nav-links a { padding: 8px 10px; font-size: 12px; }
    .project-header { padding: 30px 0; }
    .back-link { margin-bottom: 30px; }
    .project-header h1 { font-size: clamp(36px, 8vw, 56px); }
    .project-subtitle { font-size: 13px; }
    .project-hero { aspect-ratio: 4 / 3; border-radius: 12px; }
    .project-hero img.contain { padding: 12px; }
    .project-content { grid-template-columns: 1fr; gap: 30px; padding: 35px 0 10px; }
    .project-sidebar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .project-sidebar > div { padding: 18px; margin: 0; }
    .project-gallery { grid-template-columns: 1fr; gap: 25px; }
    .gallery-section { padding: 20px 0 45px; }
    .next-project { padding-bottom: 55px; }
}
@media (max-width: 420px) {
    .project-sidebar { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; }
    .project-gallery a:hover, .project-gallery a:hover img { transform: none; }
}
</style>
</head>

<body>

    <!-- NAVIGATION -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Mekhi Powell</a>

                <div class="nav-links">
                    <a href="index.html#about">About</a>
                    <a href="index.html#projects">Projects</a>
                    <a href="index.html#experience">Experience</a>
                    <a href="index.html#resume">Résumé</a>
                </div>
            </nav>
        </div>
    </header>

    <main>

        <!-- PROJECT TITLE -->
        <div class="container project-header">
            <a href="index.html#projects" class="back-link">
                &larr; Back to Projects
            </a>

            <div class="project-label" id="project-number">
                Project
            </div>

            <h1 id="project-title">Engineering Project</h1>

            <div class="project-subtitle" id="project-subtitle"></div>
        </div>

        <!-- PROJECT IMAGE -->
        <div class="container">
            <div class="project-hero">
                <img id="project-image" src="" alt="">
            </div>
        </div>

        <!-- PROJECT DETAILS -->
        <div class="container project-content">

            <aside class="project-sidebar">
                <div>
                    <strong>Project Date</strong>
                    <p id="project-date"></p>
                </div>

                <div>
                    <strong>Technical Focus</strong>
                    <p id="project-focus"></p>
                </div>
            </aside>

            <div class="project-body">

                <section>
                    <h2>Project Overview</h2>
                    <p id="project-overview"></p>
                </section>

                <section>
                    <h2>Design &amp; Development</h2>
                    <ul id="project-highlights"></ul>
                </section>

                <section>
                    <h2>Results &amp; Takeaways</h2>
                    <p id="project-results"></p>
                </section>

            </div>
        </div>

<!-- ADDITIONAL PROJECT PHOTOS -->
<section class="container gallery-section"
         id="gallery-section" hidden>

    <h2>Project Gallery</h2>

    <div class="project-gallery"
         id="project-gallery">
    </div>

</section>

        <div class="container next-project">
            <a href="index.html#projects">
                &larr; View All Projects
            </a>
        </div>

    </main>

    <footer>
        <div class="container">
            &copy; 2026 Mekhi Powell · Mechanical Engineering
        </div>
    </footer>

    <script>
        /*
          PROJECT INFORMATION

          To change a project description later,
          edit its entry below.
        */

        const projects = {

            /* PROJECT 01 */
            charpy: {
                number: "01",
                title: "Charpy Impact Tester",
                subtitle: "Mechanical Design / SolidWorks / Prototyping",
                date: "February – May 2026",
                focus: "SolidWorks, Prototyping, Arduino, Instrumentation",
                image: "charpy-2.webp",
                imageClass: "",

                overview:
                    "Designed and prototyped a low-cost Charpy impact testing apparatus to measure energy absorbed during specimen fracture. The project combined mechanical design, fabrication, and electronic instrumentation within a limited materials budget.",

                highlights: [
                    "Developed SolidWorks models and dimensioned engineering drawings for the frame and instrumentation mounts.",
                    "Selected materials and designed the mechanical assembly around a $100 project budget.",
                    "Integrated an Arduino Uno, rotary encoder, and LCD for measurement and display.",
                    "Fabricated and tested the prototype to evaluate its operation and repeatability."
                ],

                results:
                    "Completed a functional impact testing prototype capable of fracturing specimens and producing repeatable measurements. The project reinforced the importance of integrating mechanical design, instrumentation, and experimental calibration."
            },

            /* PROJECT 02 */
            nastran: {
                number: "02",
                title: "Aircraft Wing Spar Analysis",
                subtitle: "Finite Element Analysis / Simcenter NASTRAN",
                date: "Spring 2026",
                focus: "Simcenter Femap, NASTRAN, Structural Analysis",
                image: "nastran-1.webp",
                imageClass: "contain",

                overview:
                    "Developed a finite element model of an aircraft wing spar and bracing assembly in Simcenter Femap with NASTRAN to investigate load transfer, deformation, internal forces, and beam stresses. Compared simulation results with theoretical structural mechanics calculations to assess agreement and identify differences in predicted behavior.",

                highlights: [
                    "Represented the spars using 50 beam elements and the cables and ribs/braces using 13 rod elements.",
                    "Defined material properties and channel-section geometry, including cross-sectional properties and stress-recovery locations.",
                    "Evaluated displacement, axial force, shear force, bending moment, and combined beam stress under the modeled loading and support conditions.",
                    "Compared calculated member forces, support reactions, and peak compressive beam stress with NASTRAN results.",
                ],

                results:
                    "The predicted peak compressive beam stress was approximately 3,616 psi, compared with a theoretical value of 3,600 psi—a difference of 0.44%. The five listed support-reaction comparisons agreed within approximately 0.06%. Agreement varied across individual members, with some force comparisons showing substantially larger differences. These results highlight the importance of checking local member behavior alongside overall reactions and peak stress when evaluating a finite element model.",
            },

            /* PROJECT 03 */
            manatee: {
                number: "03",
                title: "Manatee Tag Release & Recovery",
                subtitle: "Senior Capstone / Mechanical Design",
                date: "2026 – 2027",
                focus: "Product Design, Mechanical Systems, Prototyping",
                image: "manatee.jpg",
                imageClass: "manatee",

                overview:
                    "Senior capstone project focused on developing an affordable underwater release and recovery system for behavioral research tags attached to African manatees. The system is intended to detach the research tag without releasing the animal's belt.",

                highlights: [
                    "Investigating programmable release mechanisms for underwater operation.",
                    "Considering sediment exposure, freshwater conditions, and entanglement risks in the mechanical design.",
                    "Developing concepts for a backup release mechanism.",
                    "Exploring methods to locate and recover detached tags without using a surface buoy."
                ],

                results:
                    "This project is in development. The engineering challenge centers on creating a reliable, compact, low-cost mechanism suitable for field conditions while balancing release functionality, animal safety, and tag recovery."
            },

            /* PROJECT 04 */
            aero: {
                number: "04",
                title: "Aerodynamic Drag Testing",
                subtitle: "Experimental Testing / Instrumentation",
                date: "November 2025",
                focus: "Aerodynamics, Wind Tunnel Testing, Instrumentation",
                image: "aero-09.jpg",
                imageClass: "",

                overview:
                    "Conducted an experimental study of aerodynamic drag using wind tunnel equipment and pressure measurements. The investigation examined how test geometry influences aerodynamic behavior.",

                highlights: [
                    "Prepared test specimens and experimental equipment for wind tunnel measurements.",
                    "Used pressure measurement instrumentation, including an inclined manometer.",
                    "Recorded experimental measurements under different flow conditions.",
                    "Used measured quantities and geometry to evaluate drag coefficients and compare results."
                ],

                results:
                    "The experiment provided hands-on experience with aerodynamic instrumentation, experimental uncertainty, data collection, and the relationship between geometry and drag."
            },

            /* PROJECT 05 */
            drone: {
                number: "05",
                title: "FPV Drone Frame Optimization",
                subtitle: "SolidWorks / FEA / Structural Optimization",
                date: "October 2025",
                focus: "SolidWorks, Finite Element Analysis, Carbon Fiber",
                image: "Quadcopter Frame Strain Analysis.png",
                imageClass: "contain",

                overview:
                    "Designed and iteratively optimized a lightweight FPV drone frame using finite element analysis to examine structural strain and identify opportunities for improved stiffness and weight efficiency.",

                highlights: [
                    "Developed a SolidWorks model incorporating orthotropic carbon fiber material properties.",
                    "Applied representative 45 N motor mounting loads in the structural analysis.",
                    "Evaluated strain distribution and identified high-strain regions around the frame arms and central hub.",
                    "Revised the geometry with additional bracing, pocketing, and fillet modifications.",
                    "Compared the initial and revised frame designs under consistent loading conditions."
                ],

                results:
                    "The revised design demonstrated reduced maximum strain in the structural analysis. This project developed practical experience with simulation-driven design iteration and the tradeoffs between structural performance and mass."
            },

            /* PROJECT 06 */
            panel: {
                number: "06",
                title: "Robotics Operator Control Panel",
                subtitle: "Onshape / Mechanical Design / Fabrication",
                date: "January 2023",
                focus: "Onshape, CAD, Woodworking, Ergonomics",
                image: "Robotics Control Console CAD Render.png",
                imageClass: "contain",

                overview:
                    "Identified usability issues with an existing FIRST Robotics Competition operator control panel and surveyed robot operators to understand their needs. Used their feedback to refine and iterate the design, then fabricated an updated panel integrating a laptop and dual controllers into a compact driver interface.",

                highlights: [
                    "Modeled the panel in Onshape with manufacturing constraints in mind.",
                    "Designed mounting positions for the laptop and controllers.",
                    "Considered operator ergonomics, accessibility, and stable equipment placement.",
                    "Fabricated and assembled the panel using available workshop tools.",
                    "Integrated cable routing and quick-disconnect considerations."
                ],

                results:
                    "Produced a functional control panel intended to improve operator ergonomics, equipment organization, and ease of setup during robotics competitions."
            },

            /* PROJECT 07 */
            frc: {
                number: "07",
                title: "FIRST Robotics Competition — Lucy",
                subtitle: "Manufacturing / Machining / Mechanical Integration",
                date: "January – April 2023",
                focus: "Machining, CAD Review, Manufacturing, Assembly",
                image: "frc-05.webp",
                imageClass: "",

                overview:
                    "Supported the fabrication and mechanical integration of a FIRST Robotics Competition robot as part of Team 321. The project involved designing, building, maintaining, and operating a competition-ready robotic system.",

                highlights: [
                    "Served as Lead Machinist for mechanical component fabrication.",
                    "Operated mills and lathes to manufacture parts for robot assemblies.",
                    "Reviewed CAD models for manufacturability, tolerances, and assembly considerations.",
                    "Collaborated with mechanical, electrical, and drive teams during subsystem integration.",
                    "Supported mechanical troubleshooting, repairs, and improvements throughout the competition season."
                ],

                results:
                    "Contributed to the manufacturing and mechanical reliability of Team 321's competition robot. The experience strengthened practical machining, assembly, problem-solving, and cross-functional teamwork skills."
            }

        };

/* =========================
   PROJECT PHOTO GALLERIES
========================= */

const galleries = {

    // 01 - CHARPY IMPACT TESTER
    charpy: [
        {
            file: "charpy-1.webp",
            caption: "Pendulum shaft and mechanical connection"
        },
        {
            file: "charpy-3.webp",
            caption: "Electronics and instrumentation assembly"
        },
        {
            file: "charpy-5.webp",
            caption: "Completed impact tester - side view"
        },
        {
            file: "charpy-6.webp",
            caption: "Arduino and LCD integration"
        }
    ],

    // 02 - AIRCRAFT WING SPAR
    nastran: [
        {
            file: "nastran-2.webp",
            caption: "Beam cross-section and section properties",
            fit: "contain"
        }
    ],

    // 03 - MANATEE CAPSTONE
    manatee: [
        // Add additional project photos here later
    ],

    // 04 - AERODYNAMIC DRAG TESTING
    aero: [
        {
            file: "aero-02.jpg",
            caption: "Differential pressure measurement"
        },
        {
            file: "aero-06.jpg",
            caption: "Wind tunnel experimental setup"
        },
        {
            file: "aero-11.jpg",
            caption: "Variable voltage regulator"
        },
        {
            file: "aero-12.jpg",
            caption: "Instrumentation wiring"
        }
    ],

    // 05 - FPV DRONE FRAME
    drone: [
        {
            file: "drone-01.webp",
            caption: "Frame design and finite element analysis",
            fit: "contain"
        },
        {
            file: "drone-02.webp",
            caption: "Structural strain visualization",
            fit: "contain"
        },
        {
            file: "drone-03.webp",
            caption: "Design iteration comparison",
            fit: "contain"
        },
        {
            file: "drone-04.webp",
            caption: "Drone frame CAD geometry",
            fit: "contain"
        }
    ],

    // 06 - ROBOTICS OPERATOR CONTROL PANEL
    panel: [
        {
            file: "panel-01.webp",
            caption: "Operator control panel CAD design",
            fit: "contain"
        },
        {
            file: "panel-02.webp",
            caption: "Wooden base fabrication"
        },
        {
            file: "panel-03.webp",
            caption: "Final operator control panel"
        }
    ],

    // 07 - FIRST ROBOTICS COMPETITION
    frc: [
        {
            file: "frc-01.webp",
            caption: "Competition robot"
        },
        {
            file: "frc-02.webp",
            caption: "Robot assembly and integration"
        },
        {
            file: "frc-06.webp",
            caption: "Robot at competition"
        },
        {
            file: "frc-09.webp",
            caption: "FIRST Robotics team and competition"
        }
    ]
};

        /*
          LOAD THE SELECTED PROJECT
        */

        const params = new URLSearchParams(window.location.search);
        const projectId = params.get("id");
        const project = projects[projectId];

        if (project) {

            document.title = project.title + " | Mekhi Powell";

            document.getElementById("project-number").textContent =
                "PROJECT " + project.number;

            document.getElementById("project-title").textContent =
                project.title;

            document.getElementById("project-subtitle").textContent =
                project.subtitle;

            document.getElementById("project-date").textContent =
                project.date;

            document.getElementById("project-focus").textContent =
                project.focus;

            document.getElementById("project-overview").textContent =
                project.overview;

            document.getElementById("project-results").textContent =
                project.results;

            const image = document.getElementById("project-image");
            image.src = project.image;
            image.alt = project.title;
            image.className = project.imageClass;

            const list = document.getElementById("project-highlights");

            project.highlights.forEach(function(highlight) {
                const item = document.createElement("li");
                item.textContent = highlight;
                list.appendChild(item);
            });

/* DISPLAY ADDITIONAL PROJECT PHOTOS */

const photos = galleries[projectId] || [];

if (photos.length > 0) {

    const gallerySection =
        document.getElementById("gallery-section");

    const galleryGrid =
        document.getElementById("project-gallery");

    photos.forEach(function(photo) {

        const figure = document.createElement("figure");

        const link = document.createElement("a");
        link.href = photo.file;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute(
            "aria-label",
            "View full image: " + photo.caption
        );

        const img = document.createElement("img");
        img.src = photo.file;
        img.alt = photo.caption;
        img.loading = "lazy";

        if (photo.fit === "contain") {
            img.classList.add("contain");
        }

        const caption = document.createElement("figcaption");
        caption.textContent = photo.caption;

        link.appendChild(img);
        figure.appendChild(link);
        figure.appendChild(caption);

        galleryGrid.appendChild(figure);
    });

    gallerySection.hidden = false;
}

        } else {

            document.getElementById("project-title").textContent =
                "Project Not Found";

            document.getElementById("project-subtitle").textContent =
                "Return to the project gallery to select a project.";

            document.querySelector(".project-hero").hidden = true;
            document.querySelector(".project-content").hidden = true;
        }
    </script>

</body>
