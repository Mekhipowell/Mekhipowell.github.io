    <style>

            --text: #252525;
            --muted: #717171;
            --border: #e6e6e6;
            --surface: #f3f3f3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.8;
        }

        .container {
            width: 88%;
            max-width: 1150px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            font-family: 'EB Garamond', Georgia, serif;
            font-weight: 500;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #777;
        }

        a:focus-visible {
            outline: 2px solid #252525;
            outline-offset: 4px;
        }

        /* NAVIGATION */
        header {
            padding: 35px 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            font-size: 13px;
        }

        /* PROJECT HEADING */
        .project-header {
            padding: 65px 0 55px;
        }

        .back-link {
            display: inline-block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 65px;
        }

        .project-label {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .project-header h1 {
            font-size: clamp(42px, 6vw, 72px);
            line-height: 1.15;
            margin: 15px 0 20px;
        }

        .project-subtitle {
            color: var(--muted);
            font-size: 14px;
        }

        /* HERO IMAGE */
        .project-hero {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--surface);
            border-radius: 5px;
            overflow: hidden;
        }

        .project-hero img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-hero img.contain {
            object-fit: contain;
            padding: 20px;
            background: var(--surface);
        }

        .project-hero img.manatee {
            object-position: 35% center;
        }

        /* TECHNICAL CONTENT */
        .project-content {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 90px;
            padding: 85px 0 120px;
        }

        .project-sidebar {
            color: var(--muted);
            font-size: 13px;
        }

        .project-sidebar strong {
            display: block;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .project-sidebar p {
            margin: 0 0 25px;
        }

        .project-body {
            max-width: 740px;
        }

        .project-body section {
            padding-bottom: 32px;
            margin-bottom: 35px;
            border-bottom: 1px solid var(--border);
        }

        .project-body h2 {
            font-size: 30px;
            margin: 0 0 20px;
        }

        .project-body p,
        .project-body li {
            color: #555;
            font-size: 15px;
            line-height: 1.9;
        }

        .project-body ul {
            padding-left: 20px;
        }

        .project-body li {
            margin-bottom: 12px;
        }

        .next-project {
            padding-bottom: 100px;
        }

        .next-project a {
            display: inline-block;
            font-size: 14px;
            border-bottom: 1px solid var(--text);
            padding-bottom: 5px;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 30px 0 45px;
            color: var(--muted);
            font-size: 12px;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .container {
                width: 90%;
            }

            header {
                padding: 25px 0;
            }

            nav {
                flex-wrap: wrap;
            }

            .nav-links {
                gap: 15px;
                font-size: 12px;
            }

            .project-header {
                padding: 30px 0 35px;
            }

            .back-link {
                margin-bottom: 45px;
            }

            .project-header h1 {
                font-size: 43px;
            }

            .project-hero {
                aspect-ratio: 4 / 3;
            }

            .project-content {
                grid-template-columns: 1fr;
                gap: 35px;
                padding: 45px 0 70px;
            }

            .project-sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }

            .project-sidebar p {
                margin-bottom: 10px;
            }

            .project-body h2 {
                font-size: 27px;
            }
        }
        
/* =========================
   PROJECT PHOTO GALLERY
========================= */

.gallery-section {
    padding-bottom: 100px;
}

.gallery-section[hidden] {
    display: none;
}

.gallery-section h2 {
    font-size: 30px;
    margin: 0 0 35px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

.project-gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 35px 25px;
}

.project-gallery figure {
    margin: 0;
    min-width: 0;
}

.project-gallery a {
    display: block;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 5px;
    background: var(--surface);
}

.project-gallery img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}

/* For CAD drawings and FEA screenshots */
.project-gallery img.contain {
    object-fit: contain;
}

.project-gallery a:hover img {
    transform: scale(1.03);
}

.project-gallery figcaption {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
}

/* Mobile */
@media (max-width: 768px) {
    .project-gallery {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .gallery-section {
        padding-bottom: 70px;
    }
}

const photos = galleries[projectId] || [];

if (photos.length > 0) {

    const gallerySection =
        document.getElementById("gallery-section");

    const galleryGrid =
        document.getElementById("project-gallery");

    photos.forEach(function(photo) {

        const figure = document.createElement("figure");

        const link = document.createElement("a");
        link.href = photo.file;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute(
            "aria-label",
            "View full image: " + photo.caption
        );

        const img = document.createElement("img");
        img.src = photo.file;
        img.alt = photo.caption;
        img.loading = "lazy";

        if (photo.fit === "contain") {
            img.classList.add("contain");
        }

        const caption = document.createElement("figcaption");
        caption.textContent = photo.caption;

        link.appendChild(img);
        figure.appendChild(link);
        figure.appendChild(caption);

        galleryGrid.appendChild(figure);
    });

    gallerySection.hidden = false;
}
